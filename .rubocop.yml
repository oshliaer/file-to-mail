# Конфиг RuboCop. Его читает Solargraph, когда форматирует файл при сохранении:
# он запускает RuboCop::Runner с флагом -a и берёт этот файл через ConfigStore.
#
# Включён только департамент Layout — раскладка кода: отступы, пробелы вокруг
# операторов, переносы, пустые строки.
#
# Style и Lint отключены намеренно. Это они переписывают код:
#   Style/GuardClause      `unless ... end`  ->  `return ... unless`
#   Lint/UselessAssignment удаляет присвоение, если переменная не используется
# Без этого файла RuboCop берёт конфиг по умолчанию, где они включены.

AllCops:
  TargetRubyVersion: 3.4
  DisabledByDefault: true

Layout:
  Enabled: true

# В HTML-heredoc хвостовые пробелы значимы, а автоправка превращает их
# в нечитаемое #{'   '} — внутри heredoc не трогаем.
Layout/TrailingWhitespace:
  AllowInHeredoc: true

Layout/LineLength:
  Enabled: false
