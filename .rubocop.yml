# Конфиг RuboCop. Его читает Solargraph, когда форматирует файл при сохранении:
# запускает RuboCop::Runner с флагом -a (safe autocorrect) и берёт этот файл
# через ConfigStore.
#
# Правила включены все — RuboCop и форматирует, и подсказывает идиоматику.
# Автокоррекция включена флагом запуска, отдельного ключа для неё нет.

AllCops:
  TargetRubyVersion: 3.4
  # Все правила включены (это и есть поведение по умолчанию, пишем явно).
  DisabledByDefault: false
  # Правила из новых версий RuboCop включать сразу, а не держать в pending.
  NewCops: enable
